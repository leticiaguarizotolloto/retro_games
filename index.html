<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames | Catálogo de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RetroGames 🎮</h1>
        <p>Seu catálogo de jogos clássicos!</p>
    </header>

    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso catálogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Jogo
            </button>
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>

        <form id="formJogo">
            <label for="jogo">Nome do jogo</label>
            <input type="text" id="jogo" name="titulo" required>

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" name="plataforma"
                   placeholder="Ex.: SNES, Mega Drive, PS1" required>

            <label for="criador">Desenvolvedora</label>
            <input type="text" id="criador" name="desenvolvedora" required>

            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" name="imagem_url"
                   placeholder="https://site.com/capa.jpg" required>

            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco"
                   min="0" step="0.01" required>

            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">
                    Cancelar
                </button>

                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
